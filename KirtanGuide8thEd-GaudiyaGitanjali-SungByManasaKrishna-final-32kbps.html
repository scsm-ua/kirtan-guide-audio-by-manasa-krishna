        "slug": "dushta-mana-tumi-kisera-vaishnava",
        "mp3": "Vaisnava_Ke_.mp3"
      },
      {
        "title": "Vaisnava Vijnapti",
        "slug": "ei-vara-karuna-kara-vaishnava-gosani",
        "mp3": "Vaisnava_Vijnapti.mp3"
      },
      {
        "title": "Vibhavari Sesa",
        "slug": "vibhavari-shiesha-aloka-praveshia",
        "mp3": "Vibhavari_Sesa.mp3"
      },
      {
        "title": "Viraha giti",
        "slug": "je-anilo-prema-dhana-karuna-prachura",
        "mp3": "Viraha-giti.mp3"
      }
    ]
  </script>
  <script>
    const tracks = JSON.parse(document.getElementById('audio-tracks').textContent);
    const list = document.getElementById('audio-list');
    const players = [];
    let activePlayer = null;
    const getMp3Url = (filename) => config.mp3BasePath
      ? `${config.mp3BasePath.replace(/\/+$/, '')}/${filename}`
      : filename;

    for (const [index, track] of tracks.entries()) {
      const mp3Url = getMp3Url(track.mp3);
      const item = document.createElement('li');
      item.className = 'track';

      const title = document.createElement('h2');
      title.className = 'track-title';
      const number = document.createElement('span');
      number.className = 'track-number';
      number.textContent = `${index + 1}.`;
      title.appendChild(number);
      const name = document.createElement('span');
      name.textContent = track.title;
      title.appendChild(name);
      item.appendChild(title);

      const links = document.createElement('div');
      links.className = 'track-links';

      const mp3Link = document.createElement('a');
      mp3Link.href = mp3Url;
      mp3Link.download = track.mp3;
      mp3Link.textContent = track.mp3;
      const downloadRow = document.createElement('div');
      downloadRow.className = 'track-link-row';
      const downloadLabel = document.createElement('span');
      downloadLabel.textContent = 'Download:';
      downloadRow.append(downloadLabel, ' ', mp3Link);
      links.appendChild(downloadRow);

      const siteLink = document.createElement('a');
      siteLink.href = `https://kirtan.site/en/${track.slug}/`;
      siteLink.target = '_blank';
      siteLink.rel = 'noopener noreferrer';
      siteLink.textContent = siteLink.href;
      siteLink.setAttribute('aria-label', `${track.title} on kirtan.site`);
      const textRow = document.createElement('div');
      textRow.className = 'track-link-row';
      const textLabel = document.createElement('span');
      textLabel.textContent = 'Text:';
      textRow.append(textLabel, ' ', siteLink);
      links.appendChild(textRow);
      item.appendChild(links);

      const player = document.createElement('audio');
      player.controls = true;
      player.preload = 'none';
      player.src = mp3Url;
      player.setAttribute('aria-label', `Play ${track.title}`);
      player.addEventListener('play', () => {
        if (activePlayer && activePlayer !== player) {
          activePlayer.pause();
          activePlayer.currentTime = 0;
          activePlayer.closest('.track').classList.remove('is-active');
        }
        activePlayer = player;
        item.classList.add('is-active');
      });
      player.addEventListener('ended', () => {
        if (activePlayer === player) {
          activePlayer = null;
          item.classList.remove('is-active');
        }
        const nextPlayer = players[index + 1];
        if (nextPlayer) {
          nextPlayer.currentTime = 0;
          nextPlayer.play().catch((error) => {
            console.warn('Could not start the next track:', error);
          });
        }
      });
      players.push(player);
      item.appendChild(player);

      list.appendChild(item);
    }
  </script>
</body>
</html>
